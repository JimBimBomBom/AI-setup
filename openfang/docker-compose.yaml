services:
  # ── OpenFang Agent OS ───────────────────────────────────────────────────────
  openfang:
    build:
      context: .
      dockerfile: Dockerfile
    image: openfang-local:latest
    container_name: openfang
    restart: unless-stopped
    env_file: .env
    ports:
      - "4200:4200"
    volumes:
      - openfang_data:/root/.openfang
      # Template is mounted outside the data volume to avoid conflicts.
      # The entrypoint runs envsubst at startup to generate the live config.toml.
      - ./config.toml.template:/config-template/config.toml.template:ro
    environment:
      OLLAMA_API_KEY: dummy            # Ollama doesn't require auth; satisfies provider validation
      OPENFANG_ALLOW_NO_AUTH: "0"      # Require API key authentication
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4200/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Scheduler Sidecar ────────────────────────────────────────────────────────
  # Registers workflows + syncs cron jobs on startup.
  # Runs a webhook relay that receives cron job output from OpenFang
  # and forwards it to Discord.
  openfang-scheduler:
    build:
      context: ./scheduler
      dockerfile: Dockerfile
    container_name: openfang-scheduler
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./workflows:/workflows:ro
      - ./scheduler:/scheduler:ro
    environment:
      OPENFANG_API_URL: http://openfang:4200
    ports:
      - "${SCHEDULER_HTTP_PORT:-9090}:${SCHEDULER_HTTP_PORT:-9090}"  # Webhook relay + metrics
    depends_on:
      openfang:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:${SCHEDULER_HTTP_PORT:-9090}/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  openfang_data:
    name: openfang_data
